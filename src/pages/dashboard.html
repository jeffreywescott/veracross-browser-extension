<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parent Digest</title>
  <link rel="icon" href="../../icons/icon-32.png">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="mark" src="../../icons/icon-48.png" alt="">
      <div>
        <h1>Parent Digest</h1>
        <p class="sub" id="subtitle">Veracross</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="refreshBtn" class="btn primary" type="button">Refresh</button>
      <button id="seenBtn" class="btn" type="button" title="Accept everything shown as the new baseline">Mark all as seen</button>
      <button id="historyBtn" class="btn ghost" type="button">History</button>
      <button id="settingsBtn" class="btn ghost icon" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <div id="progress" class="progress" hidden>
    <div class="bar"><span></span></div>
    <p class="label"></p>
  </div>

  <div id="banner"></div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Digest sections"></nav>

  <main id="panel" role="tabpanel" tabindex="-1"></main>

  <footer class="foot">
    <p>Student data stays in this browser. The extension talks only to Veracross, using your existing login, and keeps nothing anywhere else. No analytics, no remote logging.</p>
    <details id="diagnostics">
      <summary>Diagnostics</summary>
      <div class="diag-body"></div>
    </details>
  </footer>

  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" id="settingsForm">
      <h2>Settings</h2>
      <label class="field">
        <span>School route</span>
        <input name="school" autocomplete="off" spellcheck="false" placeholder="e.g. ebgis">
        <small>From your portal address: portals.veracross.com/<b>school</b>/parent</small>
      </label>
      <div class="row">
        <label class="field">
          <span>“Coming up” window</span>
          <select name="dueSoonDays">
            <option value="3">3 days</option><option value="7">7 days</option><option value="14">14 days</option>
          </select>
        </label>
        <label class="field">
          <span>First refresh marks as new</span>
          <select name="firstRunLookbackDays">
            <option value="7">last 7 days</option><option value="14">last 14 days</option><option value="30">last 30 days</option><option value="3650">everything</option>
          </select>
        </label>
      </div>
      <label class="field">
        <span>Automatic check</span>
        <select name="schedule">
          <option value="off">Off (refresh by hand)</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
        </select>
        <small id="scheduleNote">Runs in the background while the browser is open and you are logged in to Veracross. Shows a badge and notification when there's something new.</small>
      </label>
      <label class="check"><input type="checkbox" name="notify"> Show a notification after automatic checks</label>
      <label class="check"><input type="checkbox" name="fetchPostText"> Read the full text of new class posts <small>(each one opens briefly in a background tab)</small></label>
      <div class="dialog-actions">
        <button type="button" id="clearData" class="btn danger ghost">Delete all stored data</button>
        <span class="spacer"></span>
        <button value="close" class="btn primary">Done</button>
      </div>
    </form>
  </dialog>

  <dialog id="historyDialog" class="dialog wide">
    <form method="dialog">
      <h2>Past digests</h2>
      <div id="historyBody"></div>
      <div class="dialog-actions"><span class="spacer"></span><button value="close" class="btn primary">Close</button></div>
    </form>
  </dialog>

  <template id="icon-external"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M6 3H3v10h10v-3M9 2h5v5M14 2 7 9"/></svg></template>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
